# Big Red picks its GPU owner on the kernel command line, not here.
#
# The one-shot Windows entry passes vfio-pci.ids=8086:7d51 together with
# rd.driver.pre=vfio_pci, which loads vfio-pci from the initramfs before i915
# could claim 0000:00:02.0. Every other boot leaves the GPU to i915.
#
# Deliberately absent, because each of these would let vfio-pci take the GPU
# during an ordinary Linux boot and leave the machine without a desktop:
#
#   blacklist i915
#   blacklist xe
#   softdep i915 pre: vfio-pci
#   softdep xe pre: vfio-pci
#   options vfio-pci ids=8086:7d51
