# Default boot arguments for Big Red.
#
# This is the LINUX path and it is what every ordinary boot uses: i915 claims
# 0000:00:02.0, GDM starts, and GNOME Remote Desktop works. IOMMU stays enabled
# so that an explicit Windows boot has nothing left to arrange at the last
# moment, but nothing here hands the GPU to vfio-pci.
#
# Do not add vfio-pci.ids=, modprobe.blacklist=i915,xe or
# initcall_blacklist=sysfb_init here. Those belong to the one-shot Windows entry
# emitted by /etc/grub.d/42_big_red_windows_mode, so that a plain reboot, a
# recovery boot, and a failed Windows boot all land back on a working desktop.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash intel_iommu=on iommu=pt"
