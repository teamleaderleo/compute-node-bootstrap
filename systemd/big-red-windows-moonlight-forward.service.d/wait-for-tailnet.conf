# The forwarding table is built from Big Red's Tailscale IPv4, so this unit
# needs the address, not just a running daemon. After=tailscaled.service only
# guarantees the daemon.
#
# A Linux boot spends about 30s in userspace and never lost that race. The
# explicit Windows boot reaches multi-user.target in about 17s and does lose it: on
# 2026-09-10 it failed with "no current Tailscale IPs; state: NoState" roughly
# 4s into boot. Waiting for the address fixes both modes.
[Service]
ExecStartPre=/usr/local/sbin/big-red-wait-for-tailnet 60
TimeoutStartSec=180
